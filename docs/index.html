<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#1E1E22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fuel Gauge">
  <title>Fuel Gauge</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="main"><p class="muted loading">Loading…</p></main>
  <nav id="tabs" aria-label="Screens">
    <button type="button" data-view="today" aria-current="page">Today</button>
    <button type="button" data-view="foods">Foods</button>
    <button type="button" data-view="settings">Settings</button>
  </nav>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <button id="update-banner" type="button" hidden>Update available, tap to reload</button>
  <noscript>Fuel Gauge needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
